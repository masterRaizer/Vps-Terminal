# For a VPS that already runs nginx on :443. Copy to /etc/nginx/sites-available/, symlink to
# sites-enabled, then: certbot --nginx -d sync.devkillmix.com
server {
    listen 80;
    server_name sync.devkillmix.com;
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
